[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-logger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Called directly, not via passlib - see src/training/webapp/auth.py's
    # module docstring for why (passlib 1.7.4 is broken with bcrypt>=4.1).
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # fastapi.testclient's transport; tests/test_webapp.py skips itself if
    # this isn't present.
    "httpx>=0.27",
]
# src/training/simulate.py writes an .xlsx schedule; nothing else needs it.
sim = [
    "openpyxl>=3.1",
]
# LLM-assisted logging (src/training/webapp/parse_entry.py). Without it the
# app works as before, with the note box hidden.
llm = [
    "anthropic>=2.3",
]
# The hosted version's database (src/training/pg.py). Local use stays on SQLite.
postgres = [
    "psycopg[binary,pool]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]
